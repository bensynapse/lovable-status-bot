name: Keep Workflow Active

on:
  schedule:
    # Run weekly to prevent GitHub from disabling the workflow
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # GitHub pauses scheduled workflows after 60 days without repository
      # activity. Re-enabling them through the API resets that clock, which
      # is what gautamkrishnar/keepalive-workflow did before GitHub blocked it.
      - name: Keep scheduled workflows active
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in monitor.yml keepalive.yml; do
            gh workflow enable "$wf"
          done
